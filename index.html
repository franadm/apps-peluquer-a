<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="pageTitle">ALEXSTYLE - Barbershop Manager Pro</title>

    <!-- PWA / Optimización para iPhone (Agregar a inicio) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ALEXSTYLE" id="appleTitleMeta">
    <meta name="theme-color" content="#0a0a0c" id="themeColorMeta">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" id="appleTouchIcon" href="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=180&h=180&auto=format&fit=crop&q=80">
    <link rel="icon" id="favicon" href="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=64&h=64&auto=format&fit=crop&q=80">
    <link rel="manifest" id="webManifest">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        barber: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            500: '#d97706',
                            600: '#b45309',
                            700: '#92400e',
                            800: '#78350f',
                            900: '#451a03',
                        },
                        zinc: {
                            900: '#121214',
                            950: '#0a0a0c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html, body {
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }
        body { overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Altura real en Safari/iPhone (evita saltos por la barra de direcciones) */
        #app {
            height: 100vh !important;
            height: 100dvh !important;
            height: -webkit-fill-available !important;
        }

        /* Evita el zoom automático de iOS al tocar un campo de texto */
        input, select, textarea {
            font-size: 16px !important;
        }

        /* Mejor respuesta táctil (sin delay de doble-tap) */
        button, a, input, select, label {
            touch-action: manipulation;
        }

        /* Feedback táctil consistente tipo iOS */
        button:active { opacity: 0.85; }

        /* Evita que los inputs de hora (Apertura/Cierre) se desborden y se junten
           dentro de una grilla en iPhone: los items de grid no encogen por defecto */
        .grid > * { min-width: 0; }
        input[type="time"] {
            min-width: 0;
            width: 100%;
            box-sizing: border-box;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="h-full bg-gray-100 dark:bg-black text-gray-900 dark:text-gray-100 font-sans antialiased flex justify-center">

    <div id="app" class="h-full w-full max-w-md flex flex-col bg-white dark:bg-black shadow-2xl relative overflow-hidden">
        <!-- Contenido dinámico -->
    </div>

    <script>
        function formatARS(amount) {
            return Number(amount || 0).toLocaleString('es-AR', {
                style: 'currency',
                currency: 'ARS',
                maximumFractionDigits: 0
            });
        }

        const DEFAULT_CONFIG = {
            name: 'ALEXSTYLE',
            subtitle: 'Barber shop',
            logo: 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=150&auto=format&fit=crop&q=80',
            logoStyle: 'circle',
            phone: '+5493858400000',
            instagram: '@alexstyle.barber',
            startHour: '09:00',
            endHour: '23:00',
            slotDuration: 30,
            breakStart: '13:00',
            breakEnd: '14:00',
            dailyGoal: 80000,
            darkMode: false
        };

        const DEFAULT_SERVICES = [
            { id: '1', name: 'Corte de Pelo', price: 15000 },
            { id: '2', name: 'Global + Corte', price: 60000 },
            { id: '3', name: 'Clarito + Corte', price: 55000 },
        ];

        const DEFAULT_PRODUCTS = [
            { id: '1', name: 'Pomada Mate Efecto Seco', price: 12000, stock: 8 },
            { id: '2', name: 'Aceite para Barba Premium', price: 10000, stock: 5 },
        ];

        let state = {
            config: JSON.parse(localStorage.getItem('alexstyle_config')) || DEFAULT_CONFIG,
            services: JSON.parse(localStorage.getItem('alexstyle_services')) || DEFAULT_SERVICES,
            products: JSON.parse(localStorage.getItem('alexstyle_products')) || DEFAULT_PRODUCTS,
            appointments: JSON.parse(localStorage.getItem('alexstyle_appointments')) || [
                { id: '1', clientName: 'Juan Pérez', phone: '3858123456', date: new Date().toISOString().split('T')[0], time: '10:00', serviceName: 'Corte de Pelo', price: 15000, status: 'pending', paymentMethod: null }
            ],
            fiados: JSON.parse(localStorage.getItem('alexstyle_fiados')) || [],
            cashLogs: JSON.parse(localStorage.getItem('alexstyle_cash')) || [],
            expenseLogs: JSON.parse(localStorage.getItem('alexstyle_expenses')) || [],
            loyaltyRedemptions: JSON.parse(localStorage.getItem('alexstyle_loyalty_redemptions')) || [],
            referralRedemptions: JSON.parse(localStorage.getItem('alexstyle_referral_redemptions')) || [],
            activeTab: 'agenda',
            selectedDate: new Date().toISOString().split('T')[0],
            searchQuery: '',
            fiadoSearchQuery: '',
            isModalOpen: false,
            isExpenseModalOpen: false,
            isProductModalOpen: false,
            activeMenuId: null,
            activeFiadoMenuId: null,
            paymentModalApp: null,
            partialPaymentFiado: null,
            showInstallBanner: false,
            showCompletedAppointments: false
        };

        function isIOSDevice() {
            return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
        }

        function isStandaloneMode() {
            return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
        }

        state.showInstallBanner = isIOSDevice() && !isStandaloneMode() && !localStorage.getItem('alexstyle_install_dismissed');

        function dismissInstallBanner() {
            state.showInstallBanner = false;
            localStorage.setItem('alexstyle_install_dismissed', '1');
            render();
        }

        if (!state.config.logoStyle) state.config.logoStyle = 'circle';
        if (!state.config.dailyGoal) state.config.dailyGoal = 80000;
        if (!state.config.loyaltyGoal) state.config.loyaltyGoal = 8;
        if (!state.config.referralGoal) state.config.referralGoal = 3;

        function saveState() {
            localStorage.setItem('alexstyle_config', JSON.stringify(state.config));
            localStorage.setItem('alexstyle_services', JSON.stringify(state.services));
            localStorage.setItem('alexstyle_products', JSON.stringify(state.products));
            localStorage.setItem('alexstyle_appointments', JSON.stringify(state.appointments));
            localStorage.setItem('alexstyle_fiados', JSON.stringify(state.fiados));
            localStorage.setItem('alexstyle_cash', JSON.stringify(state.cashLogs));
            localStorage.setItem('alexstyle_expenses', JSON.stringify(state.expenseLogs));
            localStorage.setItem('alexstyle_loyalty_redemptions', JSON.stringify(state.loyaltyRedemptions));
            localStorage.setItem('alexstyle_referral_redemptions', JSON.stringify(state.referralRedemptions));
            render();
        }

        function updateTheme() {
            if (state.config.darkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        let lastManifestUrl = null;
        function updateAppleMeta() {
            const name = state.config.name || 'ALEXSTYLE';
            const logo = state.config.logo || DEFAULT_CONFIG.logo;
            const bgColor = state.config.darkMode ? '#0a0a0c' : '#ffffff';

            document.getElementById('pageTitle').textContent = `${name} - Barbershop Manager Pro`;
            document.getElementById('appleTitleMeta').setAttribute('content', name);
            document.getElementById('themeColorMeta').setAttribute('content', bgColor);
            document.getElementById('appleTouchIcon').setAttribute('href', logo);
            document.getElementById('favicon').setAttribute('href', logo);

            const manifest = {
                name: `${name} - Barbershop Manager Pro`,
                short_name: name,
                start_url: '.',
                display: 'standalone',
                background_color: bgColor,
                theme_color: bgColor,
                icons: [
                    { src: logo, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                    { src: logo, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                ]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
            const url = URL.createObjectURL(blob);
            document.getElementById('webManifest').setAttribute('href', url);
            if (lastManifestUrl) URL.revokeObjectURL(lastManifestUrl);
            lastManifestUrl = url;
        }

        function getAvailableSlots() {
            const { startHour, endHour, slotDuration, breakStart, breakEnd } = state.config;
            if (!startHour || !endHour) return [];
            let slots = [];
            let [sH, sM] = startHour.split(':').map(Number);
            let [eH, eM] = endHour.split(':').map(Number);
            
            let current = sH * 60 + sM;
            let end = eH * 60 + eM;
            let duration = Number(slotDuration) || 30;

            let bStart = -1, bEnd = -1;
            if (breakStart && breakEnd) {
                let [bSH, bSM] = breakStart.split(':').map(Number);
                let [bEH, bEM] = breakEnd.split(':').map(Number);
                bStart = bSH * 60 + bSM;
                bEnd = bEH * 60 + bEM;
            }

            let booked = state.appointments
                .filter(a => a.date === state.selectedDate && a.status !== 'cancelled')
                .map(a => a.time);

            while (current + duration <= end) {
                let h = Math.floor(current / 60).toString().padStart(2, '0');
                let m = (current % 60).toString().padStart(2, '0');
                let timeStr = `${h}:${m}`;
                let inBreak = bStart !== -1 && current >= bStart && current < bEnd;

                if (!inBreak && !booked.includes(timeStr)) {
                    slots.push(timeStr);
                }
                current += duration;
            }
            return slots;
        }

        function calculateRevenue(period) {
            let now = new Date();
            return state.cashLogs.filter(log => {
                let logDate = new Date(log.date);
                if (period === 'day') return logDate.toDateString() === now.toDateString();
                if (period === 'week') {
                    let startOfWeek = new Date(now);
                    startOfWeek.setDate(now.getDate() - now.getDay());
                    return logDate >= startOfWeek;
                }
                if (period === 'month') return logDate.getMonth() === now.getMonth() && logDate.getFullYear() === now.getFullYear();
                return true;
            }).reduce((acc, curr) => acc + curr.amount, 0);
        }

        function calculateExpenses(period) {
            let now = new Date();
            return state.expenseLogs.filter(log => {
                let logDate = new Date(log.date);
                if (period === 'day') return logDate.toDateString() === now.toDateString();
                if (period === 'week') {
                    let startOfWeek = new Date(now);
                    startOfWeek.setDate(now.getDate() - now.getDay());
                    return logDate >= startOfWeek;
                }
                if (period === 'month') return logDate.getMonth() === now.getMonth() && logDate.getFullYear() === now.getFullYear();
                return true;
            }).reduce((acc, curr) => acc + curr.amount, 0);
        }

        function renderLogoHTML(customClass = "") {
            const style = state.config.logoStyle || 'circle';
            // El marco (mosaico) siempre mantiene su tamaño w-11 h-11.
            // La imagen se agranda un poco por dentro (overflow visible) sin tocar el marco.
            let containerClass = "relative w-11 h-11 rounded-2xl overflow-visible bg-gradient-to-br from-amber-500 to-barber-700 flex items-center justify-center text-white font-bold shadow-md shadow-amber-900/20 " + customClass;
            let imgClass = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[122%] h-[122%] object-cover rounded-2xl";

            if (style === 'circle') {
                containerClass = "relative w-11 h-11 rounded-full overflow-visible bg-gradient-to-br from-amber-500 to-barber-700 flex items-center justify-center text-white font-bold shadow-md shadow-amber-900/20 " + customClass;
                imgClass = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[122%] h-[122%] object-cover rounded-full";
            } else if (style === 'rectangle') {
                containerClass = "h-11 flex items-center justify-center bg-transparent border-0 shadow-none " + customClass;
                imgClass = "h-12 max-w-[176px] object-contain";
            }

            return `
                <div class="${containerClass}">
                    <img src="${state.config.logo}" alt="Logo" class="${imgClass}" onerror="this.src='https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=150&auto=format&fit=crop&q=80'">
                </div>
            `;
        }

        function renderWeekStrip() {
            let days = [];
            let today = new Date();
            for (let i = -2; i <= 4; i++) {
                let d = new Date(today);
                d.setDate(today.getDate() + i);
                let dateStr = d.toISOString().split('T')[0];
                let dayName = d.toLocaleDateString('es-AR', { weekday: 'short' }).replace('.', '');
                let dayNum = d.getDate();
                days.push({ dateStr, dayName, dayNum });
            }

            return `
                <div class="flex space-x-2 overflow-x-auto no-scrollbar py-1">
                    ${days.map(d => {
                        let isSelected = d.dateStr === state.selectedDate;
                        return `
                            <button onclick="changeDate('${d.dateStr}')" class="flex flex-col items-center justify-center min-w-[52px] py-2.5 px-1 rounded-2xl border transition-all ${isSelected ? 'bg-amber-600 text-white border-amber-600 shadow-lg shadow-amber-600/30 scale-105' : 'bg-white dark:bg-zinc-900/90 text-gray-600 dark:text-gray-400 border-gray-100 dark:border-zinc-800/80 hover:border-amber-500/50'}">
                                <span class="text-[10px] uppercase font-bold tracking-wider">${d.dayName}</span>
                                <span class="text-sm font-black mt-0.5">${d.dayNum}</span>
                            </button>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function render() {
            updateTheme();
            updateAppleMeta();
            const appEl = document.getElementById('app');

            // Guardar qué input/textarea tenía el foco (y la posición del cursor)
            // antes de reconstruir el HTML, para no perder el teclado en iPhone.
            const activeEl = document.activeElement;
            let focusInfo = null;
            if (activeEl && appEl.contains(activeEl) && activeEl.id &&
                (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
                focusInfo = {
                    id: activeEl.id,
                    selectionStart: activeEl.selectionStart,
                    selectionEnd: activeEl.selectionEnd
                };
            }

            // Guardar el scroll del contenido principal antes de reconstruirlo.
            // Sin esto, en iPhone cada "Guardar Cambios" dentro de Ajustes
            // (formulario largo) te devuelve de golpe al principio de la pantalla.
            const prevMainEl = appEl.querySelector('main');
            const prevScrollTop = prevMainEl ? prevMainEl.scrollTop : 0;

            appEl.innerHTML = `
                <!-- Header cristal -->
                <header class="bg-white/90 dark:bg-black/90 backdrop-blur-md border-b border-gray-100 dark:border-zinc-900 px-5 py-4 flex items-center justify-between sticky top-0 z-30 transition-colors" style="padding-top: max(1rem, env(safe-area-inset-top));">
                    <div class="flex items-center space-x-3.5">
                        ${renderLogoHTML()}
                        <div>
                            <h1 class="font-black text-lg tracking-tight leading-tight">${state.config.name}</h1>
                            <p class="text-[11px] text-red-600 dark:text-red-500 font-bold tracking-widest uppercase">${state.config.subtitle || 'Barber shop'}</p>
                        </div>
                    </div>
                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-2xl bg-gray-100 dark:bg-zinc-900 text-gray-700 dark:text-gray-300 hover:scale-105 active:scale-95 transition shadow-inner">
                        ${state.config.darkMode ? '<i data-lucide="sun" class="w-4 h-4 text-amber-400"></i>' : '<i data-lucide="moon" class="w-4 h-4"></i>'}
                    </button>
                </header>

                ${state.showInstallBanner ? `
                <div class="px-4 py-2.5 bg-amber-50 dark:bg-zinc-900 border-b border-amber-200/50 dark:border-zinc-800 flex items-center justify-between gap-2 text-[11px] text-amber-800 dark:text-amber-300 font-semibold sticky top-0 z-20">
                    <span class="flex items-center space-x-2">
                        <i data-lucide="download" class="w-3.5 h-3.5 flex-shrink-0"></i>
                        <span>Instalá la app: tocá <strong>Compartir</strong> <i data-lucide="upload" class="w-3 h-3 inline"></i> y luego <strong>"Agregar a inicio"</strong></span>
                    </span>
                    <button onclick="dismissInstallBanner()" class="p-1 text-amber-600 dark:text-amber-400 flex-shrink-0"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
                ` : ''}

                <!-- Cuerpo Principal -->
                <main class="flex-1 overflow-y-auto pb-28 px-4 pt-4 space-y-4 no-scrollbar" style="padding-bottom: calc(7rem + env(safe-area-inset-bottom));">
                    ${state.activeTab === 'agenda' ? renderAgenda() : ''}
                    ${state.activeTab === 'fiados' ? renderFiados() : ''}
                    ${state.activeTab === 'caja' ? renderCaja() : ''}
                    ${state.activeTab === 'stock' ? renderStock() : ''}
                    ${state.activeTab === 'clientes' ? renderClientes() : ''}
                    ${state.activeTab === 'ajustes' ? renderAjustes() : ''}
                </main>

                <!-- Barra de Navegación Inferior de 5 Pestañas -->
                <nav class="absolute bottom-0 left-0 right-0 bg-white/95 dark:bg-black/95 backdrop-blur-xl border-t border-gray-100 dark:border-zinc-900 py-3 px-4 flex justify-between items-center z-30 transition-colors" style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
                    <button onclick="setTab('agenda')" class="flex flex-col items-center space-y-1 transition ${state.activeTab === 'agenda' ? 'text-amber-600 dark:text-amber-500 font-bold scale-105' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}">
                        <i data-lucide="calendar" class="w-5 h-5"></i>
                        <span class="text-[9px] tracking-wide">Agenda</span>
                    </button>
                    <button onclick="setTab('fiados')" class="flex flex-col items-center space-y-1 relative transition ${state.activeTab === 'fiados' ? 'text-amber-600 dark:text-amber-500 font-bold scale-105' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}">
                        <i data-lucide="users" class="w-5 h-5"></i>
                        <span class="text-[9px] tracking-wide">Fiados</span>
                        ${state.fiados.length > 0 ? `<span class="absolute -top-1 -right-2 w-4 h-4 bg-red-500 text-white rounded-full text-[9px] flex items-center justify-center font-black shadow-sm">${state.fiados.length}</span>` : ''}
                    </button>
                    <button onclick="setTab('caja')" class="flex flex-col items-center space-y-1 transition ${state.activeTab === 'caja' ? 'text-amber-600 dark:text-amber-500 font-bold scale-105' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}">
                        <i data-lucide="wallet" class="w-5 h-5"></i>
                        <span class="text-[9px] tracking-wide">Caja</span>
                    </button>
                    <button onclick="setTab('stock')" class="flex flex-col items-center space-y-1 transition ${state.activeTab === 'stock' ? 'text-amber-600 dark:text-amber-500 font-bold scale-105' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}">
                        <i data-lucide="package" class="w-5 h-5"></i>
                        <span class="text-[9px] tracking-wide">Stock</span>
                    </button>
                    <button onclick="setTab('clientes')" class="flex flex-col items-center space-y-1 transition ${state.activeTab === 'clientes' ? 'text-amber-600 dark:text-amber-500 font-bold scale-105' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}">
                        <i data-lucide="award" class="w-5 h-5"></i>
                        <span class="text-[9px] tracking-wide">Clientes</span>
                    </button>
                    <button onclick="setTab('ajustes')" class="flex flex-col items-center space-y-1 transition ${state.activeTab === 'ajustes' ? 'text-amber-600 dark:text-amber-500 font-bold scale-105' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                        <span class="text-[9px] tracking-wide">Ajustes</span>
                    </button>
                </nav>

                <!-- Modales -->
                ${state.isModalOpen ? renderNewAppointmentModal() : ''}
                ${state.isExpenseModalOpen ? renderNewExpenseModal() : ''}
                ${state.isProductModalOpen ? renderNewProductModal() : ''}
                ${state.paymentModalApp ? renderPaymentModal() : ''}
                ${state.partialPaymentFiado ? renderPartialModal() : ''}
            `;
            lucide.createIcons();

            // Restaurar el scroll donde estaba (misma pestaña) para no perder
            // el lugar dentro de formularios largos como el de Ajustes.
            const newMainEl = appEl.querySelector('main');
            if (newMainEl && prevScrollTop > 0) {
                newMainEl.scrollTop = prevScrollTop;
            }

            // Restaurar el foco (y el cursor) en el input que se estaba usando,
            // para que el teclado del iPhone no se cierre al escribir cada letra.
            if (focusInfo) {
                const newEl = document.getElementById(focusInfo.id);
                if (newEl) {
                    newEl.focus();
                    if (typeof newEl.setSelectionRange === 'function' &&
                        typeof focusInfo.selectionStart === 'number') {
                        try {
                            newEl.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd);
                        } catch (err) { /* algunos tipos de input no soportan selección */ }
                    }
                }
            }
        }

        function renderAppointmentCard(app) {
            return `
                <div class="p-4 rounded-3xl bg-white dark:bg-zinc-900/90 border shadow-sm relative transition-all ${app.status === 'completed' ? 'border-emerald-500/30 dark:border-emerald-500/20 opacity-80' : 'border-gray-100 dark:border-zinc-800/80'}">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-3.5">
                            <div class="p-2.5 rounded-2xl bg-amber-50 dark:bg-zinc-800 text-amber-700 dark:text-blue-400 font-black text-xs flex items-center shadow-inner">
                                <i data-lucide="clock" class="w-3.5 h-3.5 mr-1.5"></i> ${app.time}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm tracking-tight">${app.clientName}</h3>
                                <p class="text-[11px] text-gray-400 font-medium">${app.serviceName}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="font-black text-amber-600 dark:text-emerald-400 text-sm tracking-tight">${formatARS(app.price)}</span>
                            <div class="relative">
                                <button onclick="toggleMenu('${app.id}')" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-zinc-800 text-gray-400 transition">
                                    <i data-lucide="more-vertical" class="w-4 h-4"></i>
                                </button>
                                ${state.activeMenuId === app.id ? `
                                    <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-zinc-900 rounded-2xl shadow-2xl border border-gray-100 dark:border-zinc-800 py-1.5 z-20 overflow-hidden">
                                        ${app.status === 'pending' ? `<button onclick="openPaymentModal('${app.id}')" class="w-full text-left px-4 py-2.5 text-xs font-semibold text-emerald-600 dark:text-emerald-400 hover:bg-gray-50 dark:hover:bg-zinc-800 flex items-center space-x-2.5"><i data-lucide="dollar-sign" class="w-4 h-4"></i> Cobrar / Finalizar</button>` : ''}

        function renderAgenda() {

                .filter(a => a.date === state.selectedDate && a.status !== 'cancelled')

                .sort((a,b) => a.time.localeCompare(b.time));

            let pendingApps = dayApps.filter(a => a.status !== 'completed');
            let completedApps = dayApps.filter(a => a.status === 'completed');

            return `

                        <!-- Botón Nuevo Turno (en el medio) -->

                            <i data-lucide="plus" class="w-4 h-4"></i>

        function renderFiados() {

                                                <div class="flex items-center justify-between text-xs bg-gray-50 dark:bg-zinc-800/50 p-2.5 rounded-2xl">
                                                    <div class="flex items-center space-x-2.5">
                                                        <i data-lucide="${isPayment ? 'arrow-down-left' : 'scissors'}" class="w-3.5 h-3.5 ${isPayment ? 'text-emerald-500' : 'text-amber-500'}"></i>

                                                    <span class="font-black ${isPayment ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}">

        function renderCaja() {
            let dayRev = calculateRevenue('day');
            let dayExp = calculateExpenses('day');
            let dayNet = dayRev - dayExp;

            let goal = state.config.dailyGoal || 80000;
            let percent = Math.min(Math.round((dayRev / goal) * 100), 100);
            let goalReached = dayRev >= goal;

            return `
                <div class="space-y-4">
                    <div class="bg-white dark:bg-zinc-900/90 p-5 rounded-3xl border border-gray-100 dark:border-zinc-800/80 shadow-sm space-y-4">
                        <div class="flex justify-between items-center">
                            <h2 class="font-bold text-sm tracking-tight flex items-center"><i data-lucide="wallet" class="w-4 h-4 mr-2 text-amber-600 dark:text-amber-500"></i> Balance Financiero</h2>
                            <button onclick="openExpenseModal()" class="px-3 py-1.5 bg-red-500/10 dark:bg-red-500/20 text-red-600 dark:text-red-400 rounded-xl text-xs font-bold hover:bg-red-500/20 transition flex items-center space-x-1.5">
                                <i data-lucide="minus-circle" class="w-3.5 h-3.5"></i><span>Registrar Gasto</span>
                            </button>

                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold ${goalReached ? 'text-emerald-600 dark:text-emerald-400' : 'text-gray-500'}">Meta Diaria (${percent}%)</span>
                                <span class="font-black ${goalReached ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-500'}">${goalReached ? '¡Meta Superada!' : formatARS(dayRev) + ' / ' + formatARS(goal)}</span>
                            </div>

                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-2.5 pt-1">
                            <div class="bg-gray-50 dark:bg-zinc-800/50 p-3 rounded-2xl text-center border border-gray-100/50 dark:border-zinc-800/50">
                                <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Ingresos (Día)</p>
                                <p class="text-xs font-black text-emerald-600 dark:text-emerald-400 mt-1">${formatARS(dayRev)}</p>
                            </div>
                            <div class="bg-gray-50 dark:bg-zinc-800/50 p-3 rounded-2xl text-center border border-gray-100/50 dark:border-zinc-800/50">
                                <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Gastos (Día)</p>
                                <p class="text-xs font-black text-red-600 dark:text-red-400 mt-1">${formatARS(dayExp)}</p>
                            </div>
                            <div class="bg-gray-50 dark:bg-zinc-800/50 p-3 rounded-2xl text-center border border-gray-100/50 dark:border-zinc-800/50">
                                <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Neto (Día)</p>
                                <p class="text-xs font-black text-amber-600 dark:text-amber-400 mt-1">${formatARS(dayNet)}</p>
                            </div>

                        <p class="text-[10px] text-gray-400 -mt-2 leading-relaxed">Suma solo lo cobrado en efectivo/transferencia, ventas y abonos de fiado. No incluye saldo fiado pendiente.</p>
                        <div class="grid grid-cols-3 gap-2.5">
                            <div class="bg-gray-50 dark:bg-zinc-800/50 p-3 rounded-2xl text-center border border-gray-100/50 dark:border-zinc-800/50">
                                <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Día</p>
                                <p class="text-xs font-black text-emerald-600 dark:text-emerald-400 mt-1">${formatARS(calculateRevenue('day'))}</p>
                            </div>
                            <div class="bg-gray-50 dark:bg-zinc-800/50 p-3 rounded-2xl text-center border border-gray-100/50 dark:border-zinc-800/50">
                                <p class="text-[9px] text-gray-400 uppercase font-bold tracking-widest">Semana</p>
                                <p class="text-xs font-black text-emerald-600 dark:text-emerald-400 mt-1">${formatARS(calculateRevenue('week'))}</p>

                    <div class="space-y-3">
                        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Últimos Movimientos</h2>

                        ${state.cashLogs.slice().reverse().map(l => `
                            <div class="p-3.5 bg-white dark:bg-zinc-900/90 rounded-2xl border border-gray-100 dark:border-zinc-800/80 flex items-center justify-between text-xs shadow-sm">

                        `).join('')}

                        ${state.expenseLogs.slice().reverse().map(e => `
                            <div class="p-3.5 bg-white dark:bg-zinc-900/90 rounded-2xl border border-red-100 dark:border-zinc-800/80 flex items-center justify-between text-xs shadow-sm">
                                <div class="flex items-center space-x-3">
                                    <div class="p-2 bg-red-50 dark:bg-red-500/10 text-red-600 rounded-xl"><i data-lucide="arrow-up-right" class="w-4 h-4"></i></div>
                                    <div><p class="font-bold tracking-tight">Gasto: ${e.description}</p><p class="text-[10px] text-gray-400 mt-0.5">${new Date(e.date).toLocaleString()}</p></div>

        function renderStock() {
            return `
                <div class="space-y-4">
                    <div class="bg-white dark:bg-zinc-900/90 p-5 rounded-3xl border border-gray-100 dark:border-zinc-800/80 shadow-sm space-y-4">

        // ==========================================================
        // AJUSTES — helpers de UI reutilizables
        // Se centraliza aquí el "look" de tarjetas, campos y switches
        // para no repetir las mismas clases de Tailwind en cada sección
        // y poder tocar el estilo de todos los ajustes en un solo lugar.
        // ==========================================================

        const SETTINGS_INPUT_BASE_CLASS = "px-3.5 py-2.5 bg-gray-50 dark:bg-zinc-800 rounded-2xl text-xs outline-none border border-gray-100 dark:border-zinc-700";
        const SETTINGS_INPUT_CLASS = `w-full mt-1.5 ${SETTINGS_INPUT_BASE_CLASS}`;

        function settingsCard(title, colorClass, iconName, innerHtml) {
            return `
                <div class="bg-white dark:bg-zinc-900/90 p-5 rounded-3xl border border-gray-100 dark:border-zinc-800/80 shadow-sm space-y-4">
                    <h2 class="flex items-center gap-1.5 font-bold text-xs uppercase tracking-widest ${colorClass}">
                        <i data-lucide="${iconName}" class="w-3.5 h-3.5"></i>
                        <span>${title}</span>
                    </h2>
                    ${innerHtml}
                </div>
            `;
        }

        function settingsField(label, id, value, type = 'text', extraClass = '') {
            return `
                <div>
                    <label class="text-[11px] font-medium text-gray-400">${label}</label>
                    <input type="${type}" id="${id}" value="${value ?? ''}" class="${SETTINGS_INPUT_CLASS} ${extraClass}">
                </div>
            `;
        }

        // Switch tipo iOS para ajustes on/off (ej. Modo Oscuro)
        function settingsToggle(checked, onclick) {
            return `
                <button type="button" onclick="${onclick}" aria-pressed="${checked}"
                    class="relative inline-flex h-7 w-12 flex-shrink-0 items-center rounded-full transition-colors ${checked ? 'bg-amber-600' : 'bg-gray-300 dark:bg-zinc-700'}">
                    <span class="inline-block h-5 w-5 transform rounded-full bg-white shadow-md transition-transform ${checked ? 'translate-x-6' : 'translate-x-1'}"></span>
                </button>
            `;
        }

        // ============================================================
        // FIDELIDAD Y REFERIDOS
        // ============================================================
        function normalizeClientKey(name, phone) {
            return (name || '').trim().toLowerCase() + '|' + (phone || '').replace(/\D/g, '');
        }

        function getClientsSummary() {
            const map = {};
            state.appointments.filter(a => a.status === 'completed').forEach(a => {
                const key = normalizeClientKey(a.clientName, a.phone);
                if (!map[key]) {
                    map[key] = { key, name: a.clientName, phone: a.phone, visits: 0, lastVisit: a.date, referidoPor: null };
                }
                map[key].visits++;
                if (new Date(a.date) > new Date(map[key].lastVisit)) map[key].lastVisit = a.date;
                if (a.referidoPor && !map[key].referidoPor) map[key].referidoPor = a.referidoPor;
            });
            return Object.values(map);
        }

        function getLoyaltyProgress(client) {
            const goal = state.config.loyaltyGoal || 8;
            const redemptions = state.loyaltyRedemptions.filter(r => r.clientKey === client.key).length;
            const progress = client.visits - (redemptions * goal);
            const remainder = progress % goal;
            const readyToRedeem = progress > 0 && remainder === 0;
            return { goal, current: readyToRedeem ? goal : Math.max(0, remainder), readyToRedeem };
        }

        function redeemLoyalty(clientKey) {
            state.loyaltyRedemptions.push({ clientKey, date: new Date().toISOString() });
            saveState();
        }

        function getReferralCount(name) {
            const clients = getClientsSummary();
            const referred = new Set();
            clients.forEach(c => {
                if (c.referidoPor && c.referidoPor.trim().toLowerCase() === (name || '').trim().toLowerCase()) {
                    referred.add(c.key);
                }
            });
            return referred.size;
        }

        function getReferralProgress(client) {
            const goal = state.config.referralGoal || 3;
            const totalReferred = getReferralCount(client.name);
            const redemptions = state.referralRedemptions.filter(r => r.clientKey === client.key).length;
            const progress = totalReferred - (redemptions * goal);
            const remainder = progress % goal;
            const readyToRedeem = progress > 0 && remainder === 0;
            return { goal, current: readyToRedeem ? goal : Math.max(0, remainder), readyToRedeem, totalReferred };
        }

        function redeemReferral(clientKey) {
            state.referralRedemptions.push({ clientKey, date: new Date().toISOString() });
            saveState();
        }

        function renderClientes() {
            const clients = getClientsSummary().sort((a, b) => b.visits - a.visits);
            const loyaltyGoal = state.config.loyaltyGoal || 8;
            const referralGoal = state.config.referralGoal || 3;
            return `
                <div class="space-y-4 pb-4">
                    <div class="bg-gradient-to-br from-amber-500 to-barber-700 rounded-3xl p-5 text-white shadow-lg shadow-amber-900/20">
                        <p class="text-[10px] uppercase tracking-widest text-amber-100 font-bold">Programa de Fidelidad y Referidos</p>
                        <p class="text-xs text-amber-50 mt-1.5 leading-relaxed">Cada ${loyaltyGoal} cortes, 1 gratis · Cada ${referralGoal} amigos referidos, 1 premio</p>
                    </div>
                    <div class="space-y-3">
                        ${clients.length === 0 ? `
                            <div class="text-center py-10 opacity-50">
                                <i data-lucide="award" class="w-10 h-10 mx-auto mb-2"></i>
                                <p class="text-xs font-medium text-gray-400">Todavía no hay clientes con turnos completados.</p>
                            </div>
                        ` : clients.map(c => {
                            const loyalty = getLoyaltyProgress(c);
                            const referral = getReferralProgress(c);
                            return `
                            <div class="bg-white dark:bg-zinc-900/90 p-4 rounded-3xl border border-gray-100 dark:border-zinc-800/80 shadow-sm space-y-3">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="font-bold text-sm">${c.name}</p>
                                        <p class="text-[10px] text-gray-400">${c.visits} cortes totales${c.phone ? ' · ' + c.phone : ''}</p>
                                    </div>
                                    ${c.phone ? `<a href="https://wa.me/${c.phone.replace(/\D/g, '')}" target="_blank" class="p-2 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400"><i data-lucide="message-circle" class="w-4 h-4"></i></a>` : ''}
                                </div>

                                <div>
                                    <div class="flex items-center justify-between mb-1">
                                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide flex items-center gap-1"><i data-lucide="star" class="w-3 h-3"></i> Fidelidad</p>
                                        <p class="text-[10px] font-bold ${loyalty.readyToRedeem ? 'text-emerald-500' : 'text-gray-400'}">${loyalty.current}/${loyalty.goal}</p>
                                    </div>
                                    <div class="w-full h-2 bg-gray-100 dark:bg-zinc-800 rounded-full overflow-hidden">
                                        <div class="h-full bg-amber-500 rounded-full transition-all" style="width:${Math.min(100, (loyalty.current / loyalty.goal) * 100)}%"></div>
                                    </div>
                                    ${loyalty.readyToRedeem ? `<button onclick="redeemLoyalty('${c.key}')" class="mt-2 w-full py-2 bg-amber-500 text-white text-[11px] font-bold rounded-xl active:scale-95 transition">🎁 Canjear corte gratis</button>` : ''}
                                </div>

                                ${referral.totalReferred > 0 ? `
                                <div>
                                    <div class="flex items-center justify-between mb-1">
                                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide flex items-center gap-1"><i data-lucide="user-plus" class="w-3 h-3"></i> Referidos</p>
                                        <p class="text-[10px] font-bold ${referral.readyToRedeem ? 'text-emerald-500' : 'text-gray-400'}">${referral.current}/${referral.goal}</p>
                                    </div>
                                    <div class="w-full h-2 bg-gray-100 dark:bg-zinc-800 rounded-full overflow-hidden">
                                        <div class="h-full bg-sky-500 rounded-full transition-all" style="width:${Math.min(100, (referral.current / referral.goal) * 100)}%"></div>
                                    </div>
                                    ${referral.readyToRedeem ? `<button onclick="redeemReferral('${c.key}')" class="mt-2 w-full py-2 bg-sky-500 text-white text-[11px] font-bold rounded-xl active:scale-95 transition">🎁 Canjear premio por referidos</button>` : ''}
                                </div>
                                ` : ''}
                            </div>
                        `; }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleDarkMode() { state.config.darkMode = !state.config.darkMode; saveState(); }
        function changeDate(d) { state.selectedDate = d; state.showCompletedAppointments = false; render(); }
        function toggleCompletedAppointments() { state.showCompletedAppointments = !state.showCompletedAppointments; render(); }
        function setSearchQuery(q) { state.searchQuery = q; render(); }
        function setFiadoSearchQuery(q) { state.fiadoSearchQuery = q; render(); }
        function toggleMenu(id) { state.activeMenuId = state.activeMenuId === id ? null : id; render(); }
        function toggleFiadoMenu(id) { state.activeFiadoMenuId = state.activeFiadoMenuId === id ? null : id; render(); }
        function openModal() { state.isModalOpen = true; render(); }
        function closeModal() { state.isModalOpen = false; render(); }
        function openExpenseModal() { state.isExpenseModalOpen = true; render(); }
        function openProductModal() { state.isProductModalOpen = true; render(); }

        function createAppointment(e) {
            e.preventDefault();
            let name = document.getElementById('modalClient').value;
            let phone = document.getElementById('modalPhone').value || state.config.phone;
            let referidoPor = document.getElementById('modalReferidoPor').value.trim();
            let srvId = document.getElementById('modalService').value;
            let time = document.getElementById('modalTime').value;
            let srv = state.services.find(s => s.id === srvId);

            state.appointments.push({
                id: Date.now().toString(),
                clientName: name,
                phone: phone,
                referidoPor: referidoPor || null,
                date: state.selectedDate,
                time: time,
                serviceName: srv.name,
                price: srv.price,
                status: 'pending',
                paymentMethod: null
            });
            state.isModalOpen = false;
            saveState();
        }

        function cancelAppointment(id) {
            state.appointments = state.appointments.map(a => a.id === id ? { ...a, status: 'cancelled' } : a);
            state.activeMenuId = null;
            saveState();
        }

        function openPaymentModal(id) {
            state.paymentModalApp = state.appointments.find(a => a.id === id);
            state.activeMenuId = null;
            render();
        }

        function processPayment(method) {
            let app = state.paymentModalApp;
            state.appointments = state.appointments.map(a => a.id === app.id ? { ...a, status: 'completed', paymentMethod: method } : a);
            state.paymentModalApp = null;

            if (method === 'fiado') {
                let existing = state.fiados.find(f => f.clientName.toLowerCase() === app.clientName.toLowerCase());
                let entry = { 
                    type: 'debt', 
                    date: app.date, 
                    time: app.time, 
                    service: app.serviceName, 
                    amount: app.price 
                };
                if (existing) {
                    existing.totalAmount += app.price;
                    if (!existing.history) existing.history = [];
                    existing.history.push(entry);
                } else {
                    state.fiados.push({ 
                        id: Date.now().toString(), 
                        clientName: app.clientName, 
                        phone: app.phone, 
                        totalAmount: app.price, 
                        history: [entry] 
                    });
                }
            } else {
                state.cashLogs.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `${app.serviceName} - ${app.clientName}`, amount: app.price });
            }
            saveState();
        }

        function createExpense(e) {
            e.preventDefault();
            let desc = document.getElementById('expenseDesc').value;
            let amt = Number(document.getElementById('expenseAmt').value);
            if (desc && amt > 0) {
                state.expenseLogs.push({ id: Date.now().toString(), date: new Date().toISOString(), description: desc, amount: amt });
                state.isExpenseModalOpen = false;
                saveState();
            }
        }

        function createProduct(e) {
            e.preventDefault();
            let name = document.getElementById('prodName').value;
            let price = Number(document.getElementById('prodPrice').value);
            let stock = Number(document.getElementById('prodStock').value);
            if (name && price >= 0 && stock >= 0) {
                state.products.push({ id: Date.now().toString(), name, price, stock });
                state.isProductModalOpen = false;
                saveState();
            }
        }

        function sellProduct(id) {
            let p = state.products.find(x => x.id === id);
            if (p && p.stock > 0) {
                p.stock--;
                state.cashLogs.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `Venta Producto: ${p.name}`, amount: p.price });
                saveState();
            } else {
                alert('No hay stock disponible de este producto.');
            }
        }

        function deleteProduct(id) {
            state.products = state.products.filter(p => p.id !== id);
            saveState();
        }

        function sendWhatsApp(name, phone, service, time, date, price) {
            let cleanPhone = phone.replace(/\D/g, '');
            let msg = `Hola ${name}. Turno en ${state.config.name}. Fecha: ${date}. Hora: ${time}. Servicio: ${service}. Total: ${formatARS(price)}`;
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendFiadoWhatsApp(name, phone, total) {
            let cleanPhone = phone.replace(/\D/g, '');
            let msg = `Hola ${name}. Te escribimos de ${state.config.name} para recordarte tu saldo pendiente de ${formatARS(total)}. Gracias.`;
            window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function payFiadoTotal(id) {
            let f = state.fiados.find(x => x.id === id);
            state.cashLogs.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `Pago Total Fiado - ${f.clientName}`, amount: f.totalAmount });
            state.fiados = state.fiados.filter(x => x.id !== id);
            state.activeFiadoMenuId = null;
            saveState();
        }

        function openPartialModal(id) {
            state.partialPaymentFiado = state.fiados.find(x => x.id === id);
            state.activeFiadoMenuId = null;
            render();
        }

        function confirmPartialPayment() {
            let f = state.partialPaymentFiado;
            let amt = Number(document.getElementById('partialAmtInput').value);
            if (isNaN(amt) || amt <= 0) return;

            state.cashLogs.push({ id: Date.now().toString(), date: new Date().toISOString(), description: `Pago Parcial Fiado - ${f.clientName}`, amount: amt });
            
            if (!f.history) f.history = [];
            let now = new Date();
            f.history.push({
                type: 'payment',
                date: now.toLocaleDateString(),
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                amount: amt
            });

            if (amt >= f.totalAmount) {
                state.fiados = state.fiados.filter(x => x.id !== f.id);
            } else {
                f.totalAmount -= amt;
            }
            state.partialPaymentFiado = null;
            saveState();
        }

        function saveConfig() {
            state.config.name = document.getElementById('cfgName').value;
            state.config.subtitle = document.getElementById('cfgSubtitle').value;
            state.config.startHour = document.getElementById('cfgStart').value;
            state.config.endHour = document.getElementById('cfgEnd').value;
            state.config.slotDuration = Number(document.getElementById('cfgDuration').value);
            state.config.breakStart = document.getElementById('cfgBreakStart').value;
            state.config.breakEnd = document.getElementById('cfgBreakEnd').value;
            state.config.logoStyle = document.getElementById('cfgLogoStyle').value;
            state.config.dailyGoal = Number(document.getElementById('cfgGoal').value) || 80000;
            state.config.loyaltyGoal = Number(document.getElementById('cfgLoyaltyGoal').value) || 8;
            state.config.referralGoal = Number(document.getElementById('cfgReferralGoal').value) || 3;

            let logoFile = document.getElementById('cfgLogoFile').files[0];
            if (logoFile) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    state.config.logo = e.target.result;
                    saveState();
                    alert('¡Ajustes y logo guardados correctamente!');
                };
                reader.readAsDataURL(logoFile);
            } else {
                saveState();
                alert('¡Ajustes guardados correctamente!');
            }
        }

        function clearCashHistory() {
            if (confirm('¿Estás seguro de que deseas borrar todo el historial de ingresos y gastos de caja?')) {
                state.cashLogs = [];
                state.expenseLogs = [];
                saveState();
                alert('Historial de caja borrado correctamente.');
            }
        }

        function exportBackup() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `alexstyle_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    let imported = JSON.parse(evt.target.result);
                    if (imported.config && imported.services) {
                        state = imported;
                        saveState();
                        alert('¡Copia de seguridad restaurada con éxito!');
                    } else {
                        alert('El archivo no es válido.');
                    }
                } catch(err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        }

        function addService() {
            let name = document.getElementById('newSrvName').value;
            let price = Number(document.getElementById('newSrvPrice').value);
            if (name && price) {
                state.services.push({ id: Date.now().toString(), name, price });
                saveState();
            }
        }

        function deleteService(id) {
            state.services = state.services.filter(s => s.id !== id);
            saveState();
        }

        const LICENSES = [
            // { key: 'CLAVE', cliente: 'Nombre para identificarlo', vence: 'AAAA-MM-DD' }
            { key: 'AGOSTO2026-DEMO', cliente: 'Cliente de prueba', vence: '2026-09-30' },
        ];

        function normalizeKey(k) {
            return String(k || '').trim().toUpperCase().replace(/\s+/g, '');
        }

        function findLicense(key) {
            const k = normalizeKey(key);
            return LICENSES.find(l => normalizeKey(l.key) === k);
        }

        function isLicenseValid(lic) {
            if (!lic) return false;
            if (!lic.vence) return true; // sin fecha de vencimiento = válida siempre
            const vence = new Date(lic.vence + 'T23:59:59');
            return new Date() <= vence;
        }

        function showLicenseGate(message = '', prefillKey = '') {
            let gate = document.getElementById('license-gate');
            if (!gate) {
                gate = document.createElement('div');
                gate.id = 'license-gate';
                document.body.appendChild(gate);
            }
            gate.className = 'fixed inset-0 z-[999] flex items-center justify-center bg-gray-100 dark:bg-black p-6';
            gate.innerHTML = `
                <div class="w-full max-w-xs bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl p-6 space-y-4 text-center border border-gray-100 dark:border-zinc-800">
                    <div class="flex justify-center">
                        <img src="${PROVIDER_LOGO_B64}" alt="FRAN ADM" class="w-20 h-20 object-contain">
                    </div>
                    <div>
                        <h1 class="font-black text-lg tracking-tight">${(state.config && state.config.name) || 'Activación'}</h1>
                        <p class="text-xs text-gray-400 mt-1">Ingresá la clave del mes para usar la app</p>
                    </div>
                    <input id="licenseKeyInput" type="text" value="${(prefillKey || '').replace(/"/g, '&quot;')}" placeholder="Clave del mes"
                        autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"
                        class="w-full text-center tracking-widest font-bold uppercase bg-gray-50 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    ${message ? `<p class="text-xs text-amber-600 dark:text-amber-500 font-semibold">${message}</p>` : ''}
                    <button onclick="submitLicenseKey()" id="licenseSubmitBtn"
                        class="w-full bg-gradient-to-br from-amber-500 to-barber-700 text-white font-bold text-sm py-3 rounded-2xl shadow-md shadow-amber-900/20 active:scale-95 transition">
                        Activar
                    </button>
                    <div class="pt-3 border-t border-gray-100 dark:border-zinc-800 space-y-2">
                        <p class="text-[10px] text-gray-400">¿No tenés la clave de este mes? Contactá a <span class="font-bold text-gray-600 dark:text-gray-300">FRAN ADM</span></p>
                        <div class="flex items-center justify-center gap-2">
                            <a href="https://wa.me/5493858461464" target="_blank" rel="noopener"
                                class="flex-1 flex items-center justify-center gap-1.5 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 text-[11px] font-bold py-2 rounded-xl border border-emerald-100 dark:border-emerald-900/50 active:scale-95 transition">
                                <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> WhatsApp
                            </a>
                            <a href="https://instagram.com/fran_adm1" target="_blank" rel="noopener"
                                class="flex-1 flex items-center justify-center gap-1.5 bg-pink-50 dark:bg-pink-950/30 text-pink-600 dark:text-pink-400 text-[11px] font-bold py-2 rounded-xl border border-pink-100 dark:border-pink-900/40 active:scale-95 transition">

                            </a>
                        </div>
                    </div>
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        }

        function submitLicenseKey() {
            const input = document.getElementById('licenseKeyInput');
            const key = (input.value || '').trim();
            if (!key) {
                showLicenseGate('Ingresá una clave válida.', '');
                return;
            }
            const lic = findLicense(key);
            if (!lic) {
                showLicenseGate('Clave no encontrada. Pedísela a tu proveedor.', key);
                return;
            }
            if (!isLicenseValid(lic)) {
                showLicenseGate('Esta clave venció. Pedí la clave de este mes a tu proveedor.', key);
                return;
            }
            localStorage.setItem('app_license_key', key);
            bootAppAfterLicense();
        }

        function bootAppAfterLicense() {
            const gate = document.getElementById('license-gate');
            if (gate) gate.remove();
            render();
            if (!window.__licenseInterval) {
                window.__licenseInterval = setInterval(() => {
                    const savedKey = localStorage.getItem('app_license_key');
                    if (savedKey) {
                        const lic = findLicense(savedKey);
                        if (!lic || !isLicenseValid(lic)) {
                            localStorage.removeItem('app_license_key');
                            showLicenseGate('Tu clave venció. Pedí la clave de este mes a tu proveedor.', savedKey);
                        }
                    }
                }, 60 * 60 * 1000); // revisa el vencimiento cada 1 hora, sin necesitar internet
            }
        }

        function bootLicenseGate() {
            const savedKey = localStorage.getItem('app_license_key');
            if (savedKey) {
                const lic = findLicense(savedKey);
                if (lic && isLicenseValid(lic)) {
                    bootAppAfterLicense();
                    return;
                }
                localStorage.removeItem('app_license_key');
                showLicenseGate(
                    lic ? 'Tu clave venció. Pedí la clave de este mes a tu proveedor.' : 'Tu clave ya no es válida. Pedí una clave nueva.',
                    savedKey
                );
                return;
            }
            showLicenseGate();
        }

        bootLicenseGate();
    </script>
</body>
</html>
